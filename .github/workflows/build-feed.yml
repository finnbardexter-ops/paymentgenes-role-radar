name: Rebuild Role Radar feed

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch listings and rebuild feed.json
        shell: pwsh
        run: ./scripts/build-feed.ps1

      - name: Commit updated feed
        run: |
          git config user.name "role-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.json
          git diff --cached --quiet || git commit -m "Refresh feed.json"
          git push
